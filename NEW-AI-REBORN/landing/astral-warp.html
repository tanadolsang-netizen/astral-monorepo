<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Astral — ความลับรอท่านอยู่</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+Thai:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --void:#05030c; --midnight:#0a0712; --deep:#120a1f;
    --purple:#8b5cf6; --purple-dk:#6d28d9; --purple-glow:rgba(139,92,246,.45);
    --amethyst:#a78bfa; --violet:#7c3aed;
    --gold:#c9a84c; --gold-soft:rgba(154,123,52,.35); --gold-bright:#ffd97a;
    --silver:#e8e0f0; --moon:#f0e6d2; --text:#e8e0f0; --muted:#9b8fbf;
    --card:#0e0820; --card-glow:rgba(139,92,246,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{height:100%;}
  body{
    font-family:'Sarabun','Noto Serif Thai',Georgia,serif;
    background:var(--void); color:var(--text); overflow:hidden;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  /* ── COSMIC BACKGROUND ── */
  #starfield{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(154,123,52,.10) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 30%, rgba(122,90,255,.18) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(55,133,255,.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% -10%, #1a1030 0%, var(--midnight) 50%, var(--void) 100%);}
  #warp-canvas{position:fixed; inset:0; z-index:1;}
  .aurora{position:fixed; inset:-20%; z-index:3; pointer-events:none;
    background:
      radial-gradient(40% 50% at 20% 25%, rgba(154,123,52,.12), transparent 70%),
      radial-gradient(45% 55% at 82% 18%, rgba(139,92,246,.15), transparent 70%),
      radial-gradient(50% 60% at 60% 85%, rgba(79,209,255,.06), transparent 70%);
    filter:blur(50px); animation:drift 22s ease-in-out infinite alternate;}
  @keyframes drift{0%{transform:translate(0,0) scale(1);}50%{transform:translate(3%,-2%) scale(1.08);}100%{transform:translate(-2%,3%) scale(1.04);}}
  .grain{position:fixed; inset:0; z-index:4; opacity:.03; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.6) 1px, transparent 1px); background-size:3px 3px;}

  /* ── CONTENT ── */
  .warp-content{position:relative; z-index:10; text-align:center; padding:6vh 6vw;}
  h1{font-family:'Cinzel',serif; font-size:clamp(32px,5.5vw,58px); font-weight:600; line-height:1.18; margin-bottom:16px;
    background:linear-gradient(120deg,var(--gold-bright),var(--amethyst)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .sub{color:var(--muted); font-size:clamp(15px,1.8vw,18px); line-height:1.7; margin-bottom:40px; max-width:500px; margin-left:auto; margin-right:auto;}
  .skip{display:inline-block; padding:12px 28px; border-radius:999px; font-size:14px; font-weight:500;
    border:1px solid var(--purple-glow); background:rgba(139,92,246,.08); color:var(--text);
    cursor:pointer; font-family:inherit; text-decoration:none; transition:transform .25s, box-shadow .25s, border-color .3s, background .3s;}
  .skip:hover{transform:translateY(-2px); border-color:var(--purple); box-shadow:0 0 40px rgba(139,92,246,.4);}

  /* ── COUNTDOWN RING ── */
  .ring-box{margin:0 auto 40px; width:120px; height:120px; position:relative;}
  .ring-box svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-box .bg{fill:none; stroke:rgba(154,123,52,.2); stroke-width:2;}
  .ring-box .prog{fill:none; stroke:url(#grad); stroke-width:2.5; stroke-linecap:round;
    stroke-dasharray:340; stroke-dashoffset:340; transition:stroke-dashoffset 1s linear;}
  .ring-box .txt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;}
  .ring-box .num{font-family:'Cinzel',serif; font-size:36px; color:var(--moon); line-height:1;}
  .ring-box .lbl{font-size:10px; color:var(--muted); letter-spacing:2px; margin-top:4px;}

  /* ── WARP ANIMATION STATES ── */
  body.warp-done .warp-content{opacity:0; transform:scale(.95); transition:opacity .6s, transform .6s;}
  body.warp-done #warp-canvas{opacity:0; transition:opacity .6s;}

  @keyframes warpFlash{
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
  }
  .flash{position:fixed; inset:0; z-index:20; background:#fff; opacity:0; pointer-events:none;}
  body.warp-flash .flash{animation:warpFlash .5s ease;}

  @media(max-width:640px){
    h1{font-size:clamp(26px,7vw,38px);}
  }
</style>
</head>
<body>

<div id="starfield"></div>
<canvas id="warp-canvas"></canvas>
<div class="aurora"></div>
<div class="grain"></div>
<div class="flash"></div>

<div class="warp-content">
  <h1 data-i18n="WARP.title">ความลับรอท่านอยู่</h1>
  <p class="sub" data-i18n="WARP.subtitle">ฟ้าพร้อมจะเล่าแล้ว</p>

  <div class="ring-box">
    <svg viewBox="0 0 120 120">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffd97a"/>
          <stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
      </defs>
      <circle class="bg" cx="60" cy="60" r="54"/>
      <circle class="prog" id="ring-prog" cx="60" cy="60" r="54"/>
    </svg>
    <div class="txt">
      <span class="num" id="countdown">5</span>
      <span class="lbl">SECONDS</span>
    </div>
  </div>

  <a class="skip" href="astral-spa.html" data-i18n="WARP.skip">ข้ามแล้วเข้าสู่หน้าแรก →</a>
</div>

<script>
  /* ═══ i18n LOADER ═══ */
  (function() {
    var FALLBACK = {
      WARP: {
        "title":"ความลับรอท่านอยู่",
        "subtitle":"ฟ้าพร้อมจะเล่าแล้ว",
        "skip":"ข้ามแล้วเข้าสู่หน้าแรก →"
      }
    };
    function applyI18n(data) {
      window.I18N = data || FALLBACK;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        var parts = key.split('.');
        var section = parts[0], subkey = parts[1];
        var value = null;
        if (data && data[section] && data[section][subkey]) {
          var entry = data[section][subkey];
          value = (typeof entry === 'object' && entry.th) ? entry.th : entry;
        }
        if (!value && FALLBACK[section]) {
          var fb = FALLBACK[section][subkey];
          if (fb) value = (typeof fb === 'object' && fb.th) ? fb.th : fb;
        }
        if (value && typeof value === 'string') {
          el.innerHTML = value;
        }
      });
    }
    fetch('/v1/i18n')
      .then(function(r) { return r.json(); })
      .then(function(data) { applyI18n(data); })
      .catch(function() { applyI18n(FALLBACK); });
  })();

  /* ═══ WARP STARFIELD ANIMATION ═══ */
  (function(){
    const cv = document.getElementById('warp-canvas');
    const ctx = cv.getContext('2d');
    let W, H, stars = [], t = 0, warping = false, warpStart = 0;

    function resize(){
      W = cv.width = innerWidth;
      H = cv.height = innerHeight;
      stars = Array.from({length:600},()=>{
        const x = (Math.random()-0.5)*W;
        const y = (Math.random()-0.5)*H;
        const z = Math.random()*1000;
        return {x, y, z, pz: z};
      });
    }
    addEventListener('resize', resize); resize();

    function draw(){
      ctx.fillStyle = 'rgba(5,3,12,.4)';
      ctx.fillRect(0,0,W,H);
      t += 0.016;
      const cx = W/2, cy = H/2;
      const speed = warping ? 15 : 0.5;

      for(const s of stars){
        s.pz = s.z;
        s.z -= speed;
        if(s.z < 1){
          s.z = 1000;
          s.pz = 1000;
          s.x = (Math.random()-0.5)*W;
          s.y = (Math.random()-0.5)*H;
        }
        const sx = (s.x / s.z) * 500 + cx;
        const sy = (s.y / s.z) * 500 + cy;
        const psx = (s.x / s.pz) * 500 + cx;
        const psy = (s.y / s.pz) * 500 + cy;
        const size = Math.max(0.5, (1 - s.z/1000) * 2.5);
        const alpha = Math.min(1, (1 - s.z/1000) * 1.5);

        ctx.strokeStyle = `rgba(180,160,220,${alpha})`;
        ctx.lineWidth = size;
        ctx.beginPath();
        ctx.moveTo(psx, psy);
        ctx.lineTo(sx, sy);
        ctx.stroke();

        // Star glow when warping
        if(warping && s.z < 400){
          ctx.fillStyle = `rgba(255,220,150,${alpha*0.5})`;
          ctx.beginPath();
          ctx.arc(sx, sy, size*2, 0, Math.PI*2);
          ctx.fill();
        }
      }

      // Central glow
      if(warping){
        const elapsed = (performance.now() - warpStart) / 1000;
        const glow = Math.min(0.5, elapsed * 0.1);
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.4);
        grad.addColorStop(0, `rgba(255,220,150,${glow})`);
        grad.addColorStop(0.5, `rgba(139,92,246,${glow*0.5})`);
        grad.addColorStop(1, 'rgba(5,3,12,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,W,H);
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Start warp after 2s
    setTimeout(()=>{
      warping = true;
      warpStart = performance.now();
    }, 2000);

    window.triggerWarp = function(){
      document.body.classList.add('warp-flash');
      setTimeout(()=>{
        document.body.classList.remove('warp-flash');
        document.body.classList.add('warp-done');
        setTimeout(()=>{
          window.location.href = 'astral-spa.html';
        }, 800);
      }, 600);
    };
  })();

  /* ═══ COUNTDOWN + AUTO-REDIRECT ═══ */
  let count = 5;
  const ring = document.getElementById('ring-prog');
  const numEl = document.getElementById('countdown');
  const circumference = 2 * Math.PI * 54; // ~339.3

  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference;

  const interval = setInterval(() => {
    count--;
    if(count <= 0){
      clearInterval(interval);
      ring.style.strokeDashoffset = '0';
      if(window.triggerWarp) window.triggerWarp();
    } else {
      numEl.textContent = count;
      const offset = circumference - (count / 5) * circumference;
      ring.style.strokeDashoffset = offset;
    }
  }, 1000);

  // Initial ring fill
  setTimeout(()=>{
    ring.style.strokeDashoffset = circumference - (1/5) * circumference;
  }, 100);

  // Skip button handler
  document.querySelector('.skip').addEventListener('click', function(e){
    e.preventDefault();
    if(window.triggerWarp) window.triggerWarp();
  });
</script>

</body>
</html>
