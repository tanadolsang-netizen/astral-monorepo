<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Astral — เตรียมพร้อมลอยสู่ท้องฟ้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+Thai:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --void:#05030c; --midnight:#0a0712; --deep:#120a1f;
    --purple:#8b5cf6; --purple-dk:#6d28d9; --purple-glow:rgba(139,92,246,.45);
    --amethyst:#a78bfa; --violet:#7c3aed;
    --gold:#c9a84c; --gold-soft:rgba(154,123,52,.35); --gold-bright:#ffd97a;
    --silver:#e8e0f0; --moon:#f0e6d2; --text:#e8e0f0; --muted:#9b8fbf;
    --card:#0e0820; --card-glow:rgba(139,92,246,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Sarabun','Noto Serif Thai',Georgia,serif;
    background:var(--void); color:var(--text); overflow-x:hidden;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  /* ── COSMIC BACKGROUND ── */
  #starfield{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(154,123,52,.10) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 30%, rgba(122,90,255,.18) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(55,133,255,.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% -10%, #1a1030 0%, var(--midnight) 50%, var(--void) 100%);}
  #nebula{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.35;}
  #nebula canvas{width:100%; height:100%;}
  .aurora{position:fixed; inset:-20%; z-index:3; pointer-events:none;
    background:
      radial-gradient(40% 50% at 20% 25%, rgba(154,123,52,.12), transparent 70%),
      radial-gradient(45% 55% at 82% 18%, rgba(139,92,246,.15), transparent 70%),
      radial-gradient(50% 60% at 60% 85%, rgba(79,209,255,.06), transparent 70%);
    filter:blur(50px); animation:drift 22s ease-in-out infinite alternate;}
  @keyframes drift{0%{transform:translate(0,0) scale(1);}50%{transform:translate(3%,-2%) scale(1.08);}100%{transform:translate(-2%,3%) scale(1.04);}}
  .grain{position:fixed; inset:0; z-index:4; opacity:.03; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.6) 1px, transparent 1px); background-size:3px 3px;}

  /* ── MAIN CONTENT ── */
  .intro-container{position:relative; z-index:10; text-align:center; padding:6vh 6vw; max-width:800px;}
  .pill{font-family:'Cinzel',serif; font-size:12px; letter-spacing:4px; color:var(--purple); margin-bottom:28px; text-transform:uppercase; opacity:.85;}
  h1{font-family:'Cinzel',serif; font-size:clamp(32px,5.5vw,58px); font-weight:600; line-height:1.18; margin-bottom:24px;}
  h1 .g{background:linear-gradient(120deg,var(--gold-bright),var(--amethyst),var(--purple));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 20px rgba(139,92,246,.4));}
  .desc{color:var(--muted); font-size:clamp(15px,1.8vw,18px); line-height:1.85; max-width:560px; margin:0 auto 40px;}
  .cta{display:inline-block; padding:14px 34px; border-radius:999px; font-size:15px; font-weight:600;
    background:linear-gradient(135deg,var(--purple-dk),var(--purple)); color:#fff;
    box-shadow:0 0 40px rgba(139,92,246,.4); animation:pulse 4s ease-in-out infinite;
    cursor:pointer; border:none; font-family:inherit; text-decoration:none; transition:transform .25s, box-shadow .25s;}
  .cta:hover{transform:translateY(-2px); box-shadow:0 0 60px rgba(139,92,246,.7);}
  @keyframes pulse{0%,100%{box-shadow:0 0 34px rgba(139,92,246,.35);}50%{box-shadow:0 0 60px rgba(139,92,246,.65);}}
  .scroll-hint{margin-top:60px; color:var(--muted); font-size:13px; letter-spacing:1px; opacity:.6; animation:bounce 2s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(8px);}}

  /* ── ORNAMENTAL TAROT FRAME ── */
  .ornamental-border{position:relative; border:1px solid var(--purple-glow); border-radius:12px;
    background:linear-gradient(160deg, rgba(14,8,32,.92), rgba(10,7,18,.96));
    box-shadow:0 0 80px rgba(139,92,246,.15), inset 0 1px 0 rgba(139,92,246,.2);
    padding:clamp(36px,5vw,64px); max-width:700px; margin:0 auto;}
  .ornamental-border::before{content:""; position:absolute; inset:8px; border:1px solid var(--gold-soft); border-radius:8px; pointer-events:none;}
  .ornamental-border::after{content:"✦"; position:absolute; top:-12px; left:50%; transform:translateX(-50%);
    color:var(--gold-bright); font-size:24px; text-shadow:0 0 20px var(--gold); padding:0 12px; background:var(--midnight);}

  /* ── SYSTEM PREVIEW ── */
  .system-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:16px; margin-top:40px; max-width:600px; margin-left:auto; margin-right:auto;}
  .sys-item{text-align:center; padding:20px 12px; border:1px solid rgba(139,92,246,.2); border-radius:10px;
    background:linear-gradient(160deg,var(--card),rgba(10,7,18,.9)); transition:transform .3s, border-color .3s;}
  .sys-item:hover{transform:translateY(-4px); border-color:var(--purple);}
  .sys-item .ic{font-size:28px; margin-bottom:8px; filter:drop-shadow(0 0 8px var(--purple-glow));}
  .sys-item .nm{font-family:'Cinzel',serif; font-size:13px; color:var(--moon); letter-spacing:.5px;}

  @media(max-width:640px){
    h1{font-size:clamp(26px,7vw,38px);}
    .ornamental-border{padding:28px 20px;}
  }
</style>
</head>
<body>

<div id="starfield"></div>
<div id="nebula"><canvas id="nebula-canvas"></canvas></div>
<div class="aurora"></div>
<div class="grain"></div>

<div class="intro-container">
  <div class="ornamental-border">
    <p class="pill" data-i18n="INTRO.prepare">✦ เตรียมพร้อมลอยสู่ท้องฟ้า ✦</p>
    <h1 data-i18n="INTRO.title">เรื่องราวที่ฟ้าฝากมา<span class="g">ให้ท่าน</span></h1>
    <p class="desc" data-i18n="INTRO.description">ไม่ใช่การทำนายทั่วไป — แต่เป็นภาพสร้างสรรค์จากปัญญาประดิษฐ์ สไตล์ cosmic garden ที่สร้างมาจากข้อมูลดวงชะตาของท่านโดยเฉพาะ ท่านจะเห็นตัวเองในแสงดาว</p>
    <a class="cta" href="astral-spa.html" data-i18n="INTRO.cta">เริ่มต้นการเดินทาง</a>
  </div>

  <div class="system-grid">
    <div class="sys-item"><div class="ic">🌟</div><div class="nm">ดวงชะตา</div></div>
    <div class="sys-item"><div class="ic">🔮</div><div class="nm">ไพ่ทาโรต์</div></div>
    <div class="sys-item"><div class="ic">🪐</div><div class="nm">เวดิก</div></div>
    <div class="sys-item"><div class="ic">💞</div><div class="nm">ดูคู่</div></div>
  </div>

  <p class="scroll-hint" data-i18n="INTRO.scroll_hint">เลื่อนเพื่อดูลึกลับ</p>
</div>

<script>
  /* ═══ i18n LOADER ═══ */
  (function() {
    var FALLBACK = {
      INTRO: {
        "prepare":"✦ เตรียมพร้อมลอยสู่ท้องฟ้า ✦",
        "title":"เรื่องราวที่ฟ้าฝากมา<span class=\"g\">ให้ท่าน</span>",
        "description":"ไม่ใช่การทำนายทั่วไป — แต่เป็นภาพสร้างสรรค์จากปัญญาประดิษฐ์ สไตล์ cosmic garden ที่สร้างมาจากข้อมูลดวงชะตาของท่านโดยเฉพาะ ท่านจะเห็นตัวเองในแสงดาว",
        "cta":"เริ่มต้นการเดินทาง",
        "scroll_hint":"เลื่อนเพื่อดูลึกลับ"
      }
    };
    function applyI18n(data) {
      window.I18N = data || FALLBACK;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        var parts = key.split('.');
        var section = parts[0], subkey = parts[1];
        var value = null;
        if (data && data[section] && data[section][subkey]) {
          var entry = data[section][subkey];
          value = (typeof entry === 'object' && entry.th) ? entry.th : entry;
        }
        if (!value && FALLBACK[section]) {
          var fb = FALLBACK[section][subkey];
          if (fb) value = (typeof fb === 'object' && fb.th) ? fb.th : fb;
        }
        if (value && typeof value === 'string') {
          el.innerHTML = value;
        }
      });
    }
    fetch('/v1/i18n')
      .then(function(r) { return r.json(); })
      .then(function(data) { applyI18n(data); })
      .catch(function() { applyI18n(FALLBACK); });
  })();

  /* ═══ NEBULA CANVAS ═══ */
  (function(){
    const cv = document.getElementById('nebula-canvas');
    const ctx = cv.getContext('2d');
    let W, H, stars = [];
    function resize(){
      W = cv.width = innerWidth; H = cv.height = innerHeight;
      stars = Array.from({length:300},()=>({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.5+0.3, a:Math.random()*.5+.2,
        ph:Math.random()*Math.PI*2, sp:Math.random()*.002+.001
      }));
    }
    addEventListener('resize', resize); resize();
    (function draw(){
      ctx.clearRect(0,0,W,H);
      for(const s of stars){
        s.ph += s.sp;
        const a = s.a + Math.sin(s.ph)*.25;
        ctx.fillStyle = `rgba(180,160,220,${Math.max(0,a)})`;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      }
      requestAnimationFrame(draw);
    })();
  })();
</script>

</body>
</html>
