<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>รายงานดวงชะตา</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Charm:wght@700&family=Kanit:wght@300;400;600&family=Noto+Serif+Thai:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap');

  :root{
    --ground:#0c0618;
    --ground2:#1a0b2e;
    --plum:#2a1248;
    --gold:#d4af37;
    --gold-bright:#f4d77a;
    --gold-deep:#9a7b1f;
    --cream:#f3e9d2;
    --cream-dim:#c9bda3;
    --ink:#ece3cf;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{
    background:var(--ground);
    color:var(--ink);
    font-family:'Noto Sans Thai','Kanit',sans-serif;
  }

  /* page size for print */
  @page{ size:A4; margin:0; }

  .page{
    position:relative;
    width:210mm;
    min-height:297mm;
    padding:18mm 16mm;
    background:
      radial-gradient(circle at 20% 10%, rgba(120,70,180,.35), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(212,175,55,.18), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(42,18,72,.6), transparent 70%),
      linear-gradient(160deg, #150a28 0%, #0c0618 60%, #1a0b2e 100%);
    overflow:hidden;
    page-break-after:always;
  }

  /* starfield */
  .page::before{
    content:"";
    position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 22%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.3px 1.3px at 68% 14%, rgba(244,215,122,.8), transparent),
      radial-gradient(1.2px 1.2px at 33% 78%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.7px 1.7px at 88% 62%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.2px 1.2px at 52% 45%, rgba(244,215,122,.5), transparent),
      radial-gradient(1.4px 1.4px at 8% 60%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.5px 1.5px at 75% 35%, rgba(255,255,255,.5), transparent);
    background-size:300px 300px;
    opacity:.7;
  }

  /* gold ornamental corner frame */
  .frame{
    position:absolute; inset:10mm; z-index:1; pointer-events:none;
    border:2px solid var(--gold-deep);
    border-radius:14px;
    box-shadow:inset 0 0 30px rgba(212,175,55,.25), 0 0 20px rgba(212,175,55,.15);
  }
  .frame::before,.frame::after{
    content:""; position:absolute; width:34px; height:34px;
    border:3px solid var(--gold); border-radius:6px;
  }
  .frame::before{ top:-6px; left:-6px; border-right:none; border-bottom:none; }
  .frame::after{ bottom:-6px; right:-6px; border-left:none; border-top:none; }

  .content{ position:relative; z-index:2; }

  /* ── COVER ── */
  .cover{ text-align:center; padding-top:20mm; }
  .cover .brand{
    color:var(--gold); letter-spacing:.4em; font-size:11pt;
    text-transform:uppercase; font-family:'Kanit';
  }
  .cover .rule{
    width:70mm; height:1px; margin:14px auto;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    position:relative;
  }
  .cover .rule::after{
    content:"✦"; position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%); color:var(--gold);
    background:var(--ground); padding:0 10px; font-size:13pt;
  }
  .cover h1{
    color:var(--gold-bright); font-size:30pt; font-weight:700;
    text-shadow:0 0 24px rgba(212,175,55,.5), 0 2px 6px rgba(0,0,0,.6);
    font-family:'Noto Serif Thai',serif;
    letter-spacing:.02em;
  }
  .cover .sub{ color:var(--cream); opacity:.92; font-size:13pt; margin-top:10px; }
  .cover .tag{
    color:var(--cream-dim); font-style:italic; font-size:11pt;
    margin:16px auto 0; max-width:130mm; line-height:1.9;
  }
  .cover .hero{
    width:115mm; margin:18px auto 0; border-radius:14px;
    border:2px solid var(--gold);
    box-shadow:0 0 40px rgba(212,175,55,.5), 0 10px 40px rgba(0,0,0,.6);
    transform:perspective(900px) rotateX(2deg);
    position:relative; z-index:3; display:block;
  }

  /* ── SECTIONS ── */
  .section{
    position:relative; z-index:2;
    background:linear-gradient(160deg, rgba(42,18,72,.72), rgba(12,6,24,.72));
    border:1px solid rgba(212,175,55,.35);
    border-radius:16px;
    padding:16px 20px; margin:14px 0;
    box-shadow:inset 0 0 30px rgba(120,70,180,.22), 0 6px 24px rgba(0,0,0,.4);
    backdrop-filter:blur(2px);
  }
  .section .title{
    color:var(--gold-bright); font-size:16pt; font-weight:700;
    border-bottom:1px solid rgba(212,175,55,.3);
    padding-bottom:8px; margin-bottom:12px;
    text-shadow:0 0 14px rgba(212,175,55,.4);
    display:flex; align-items:center; gap:10px;
  }
  .section .title::before{ content:"❖"; color:var(--gold); font-size:13pt; }
  .section p{ font-size:13pt; line-height:2.35; margin:14px 0; color:var(--ink); text-align:left; letter-spacing:.01em; }
  .section p:first-of-type::first-letter{
    color:var(--gold-bright); font-size:38pt; font-weight:700;
    line-height:.78; padding:4px 10px 0 0; float:left;
    text-shadow:0 0 14px rgba(212,175,55,.6);
  }
  .section p:first-of-type{ overflow:hidden; }
  .kw{ color:var(--gold-bright); font-weight:600; text-shadow:0 0 8px rgba(212,175,55,.35); }

  .divider{ text-align:center; color:var(--gold); font-size:14pt; letter-spacing:.5em; margin:12px 0; }

  /* ── TAROT ── */
  .tarot-card{
    display:flex; gap:16px; align-items:center;
    background:linear-gradient(160deg, rgba(42,18,72,.8), rgba(12,6,24,.8));
    border:1.5px solid var(--gold);
    border-radius:14px; padding:12px 14px; margin:10px 0;
    box-shadow:0 0 26px rgba(212,175,55,.25), inset 0 0 22px rgba(120,70,180,.25);
  }
  .tarot-card img{
    width:40mm; height:auto; border-radius:10px;
    border:1px solid rgba(212,175,55,.5);
    box-shadow:0 0 30px rgba(212,175,55,.55), 0 8px 22px rgba(0,0,0,.6);
    transform:perspective(700px) rotateY(-4deg);
    flex:0 0 auto;
  }
  .tarot-card img.reversed{ transform:perspective(700px) rotateY(-4deg) rotate(180deg); }
  .tarot-body{ flex:1 1 auto; }
  .tarot-pos{
    display:inline-block; font-weight:600; color:var(--ground);
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    border-radius:999px; padding:3px 16px; font-size:10.5pt;
    letter-spacing:.04em; box-shadow:0 0 14px rgba(212,175,55,.5);
    font-family:'Kanit';
  }
  .tarot-name{
    font-weight:700; color:var(--gold-bright); font-size:14pt;
    margin:8px 0 6px; text-shadow:0 0 14px rgba(212,175,55,.5);
  }
  .tarot-text{ font-size:10.5pt; line-height:1.9; color:var(--ink); }

  .footer{
    position:relative; z-index:2; margin-top:16px;
    border-top:1px solid rgba(212,175,55,.3); padding-top:8px;
    color:var(--cream-dim); font-size:9pt; text-align:center; letter-spacing:.08em;
  }
  .pageno{ position:absolute; bottom:8mm; left:0; right:0; text-align:center; z-index:2;
    color:var(--gold); font-size:9pt; letter-spacing:.3em; }

  /* ── LIFE NARRATIVE (STARHEART life-grounding) — frameless gold prose ──
     ไร้กรอบทอง (frameless) แต่รักษาสีครีม/ทองเดิม ผูกกับสไตล์เดิมของ PDF */
  .life-narrative{ position:relative; z-index:2; padding:6px 2px; margin:12px 0; }
  .life-narrative .title{
    color:var(--gold-bright); font-size:16pt; font-weight:700;
    border-bottom:1px solid rgba(212,175,55,.3);
    padding-bottom:8px; margin-bottom:12px;
    text-shadow:0 0 14px rgba(212,175,55,.4);
    display:flex; align-items:center; gap:10px;
  }
  .life-narrative .title::before{ content:"❖"; color:var(--gold); font-size:13pt; }
  .life-narrative p{ font-size:13pt; line-height:2.3; margin:13px 0; color:var(--ink); text-align:left; letter-spacing:.01em; }
  .life-narrative p:first-of-type::first-letter{
    color:var(--gold-bright); font-size:34pt; font-weight:700;
    line-height:.78; padding:4px 10px 0 0; float:left;
    text-shadow:0 0 14px rgba(212,175,55,.6);
  }
  .life-narrative p:first-of-type{ overflow:hidden; }
  .life-narrative .kw{ color:var(--gold-bright); font-weight:600; text-shadow:0 0 8px rgba(212,175,55,.35); }
</style>
</head>
<body>
<!-- pages injected by builder -->
</body>
</html>
