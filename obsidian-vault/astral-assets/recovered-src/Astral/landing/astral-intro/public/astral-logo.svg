<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e4b0"/>
      <stop offset="0.5" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#9a7b34"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- monogram: ดาว 8 แฉก + อักษร A -->
  <g filter="url(#glow)" fill="url(#gold)">
    <g transform="translate(70,100)">
      <path d="M0,-46 L11,-14 L44,-14 L17,7 L28,40 L0,18 L-28,40 L-17,7 L-44,-14 L-11,-14 Z"/>
      <path d="M0,-30 L6,-9 L0,12 L-6,-9 Z" fill="#0a0712"/>
    </g>
  </g>
  <!-- wordmark -->
  <g filter="url(#glow)" fill="url(#gold)" font-family="Cinzel, 'Times New Roman', serif" font-weight="700" letter-spacing="6">
    <text x="140" y="118" font-size="74">ASTRAL</text>
  </g>
  <text x="142" y="150" fill="#c9a84c" font-family="Cinzel, serif" font-size="16" letter-spacing="10" opacity="0.8">THE COSMIC SYSTEM</text>
</svg>
