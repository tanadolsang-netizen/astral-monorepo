          - generic [ref=f1e47]: เกิดตอนกลางคืน — พลังงานแบบจันทร์/ศุกร์/อังคารมักแสดงออกได้ลื่นไหลกว่า ส่วนอาทิตย์/พฤหัส/เสาร์ต้องฝึกฝนรู้ตัวมากกว่าจะแสดงออกเต็มที่
        - listitem [ref=f1e48]:
          - generic [ref=f1e52]: ดาวที่แข็งแรงที่สุดในดวงคือ ศุกร์ ♀ (Vargottama (แข็งแรงที่สุดเท่าที่จะเป็นไปได้)) — เรื่องความรัก คุณค่า และสิ่งที่ทำให้มีความสุขน่าจะเป็นจุดที่มั่นคง เชื่อถือได้ และเป็นตัวตนแท้ของคุณมากที่สุด
        - listitem [ref=f1e53]:
          - generic [ref=f1e57]: ราศีเมถุน มีกำลัง Ashtakavarga สูงสุด (32 คะแนน) — เรื่องราวในชีวิตที่เกี่ยวกับราศีนี้มักไปได้ลื่นกว่า ส่วนราศีเมษ (20 คะแนน) เป็นจุดที่ต้องใช้ความพยายามมากกว่าปกติ
        - listitem [ref=f1e58]:
          - generic [ref=f1e62]: ดาวที่เป็นตัวแทนแก่นจิตวิญญาณของคุณคือ พฤหัสบดี ♃ — โชค การเติบโต และมุมมองต่อชีวิต คือธีมหลักที่ชีวิตนี้กำลังเรียนรู้
        - listitem [ref=f1e63]:
          - generic [ref=f1e67]: ดาวที่เป็นตัวแทนคู่ครอง/หุ้นส่วนชีวิตคือ อาทิตย์ ☉ — บอกเป็นนัยว่าคู่ที่เข้ากันจะมีธีมเรื่อง ตัวตนแก่นแท้และความมั่นใจในตัวเอง เป็นจุดเชื่อม
