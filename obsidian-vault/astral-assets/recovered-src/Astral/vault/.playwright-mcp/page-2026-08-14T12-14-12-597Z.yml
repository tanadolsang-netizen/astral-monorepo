          - paragraph [ref=e78]
          - paragraph [ref=e79]: "- Added : Support for LISUAN 7G100 series GPUs - Added \"MMDevices endpoint cleanup\" - PnpLockdownFiles removal improvements. - RemoveInstalledPfns improvement. - Added 'Reset to recommended' button for the Options."
