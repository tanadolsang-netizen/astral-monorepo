        - generic [ref=e66]:
          - paragraph [ref=e67]: Display Driver Uninstaller (DDU) is a driver removal utility that can help you completely uninstall AMD/NVIDIA/INTEL graphics card drivers and packages from your system, trying to remove all leftovers (including registry keys, folders and files, driver store). The AMD/NVIDIA/INTEL video drivers can normally be uninstalled from the Windows Control panel, this driver uninstaller program was designed to be used in cases where the standard driver uninstall fails, or when you need to thoroughly delete NVIDIA and ATI video card drivers. The current effect after you use this driver removal tool will be similar as if its the first time you install a new driver just like a fresh, clean install of Windows. As with any tool of this kind, we recommend creating a new system restore point before using it, so that you can revert your system at any time if you run into problems.
          - paragraph [ref=e68]: If you have problem installing older driver or newer one, give it a try as there are some reports that it fix those problems.
          - heading "RECOMMENDED USAGE :" [level=2] [ref=e69]
          - paragraph [ref=e70]: "-The tool can be used in Normal mode but for absolute stability when using DDU, Safemode is always the best. -Make a backup or a system restore (but it should normally be pretty safe). -It is best to exclude the DDU folder completely from any security software to avoid issues. -You do NOT need to uninstall the driver prior using DDU."
          - paragraph [ref=e71]
          - paragraph [ref=e72]: Keep note that NVIDIA/AMD/INTEL did not have anything to do with this, I do not work at or for NVIDIA/AMD/INTEL and they should not be held responsible for anything that may go wrong with this application.
          - paragraph [ref=e73]:
            - text: If you need help for using DDU, check this
            - link "GUIDE" [ref=e74] [cursor=pointer]:
              - /url: https://www.wagnardsoft.com/content/ddu-guide-tutorial/
          - heading "System Requirements:" [level=2] [ref=e75]
          - paragraph [ref=e76]: .NET framework 4.8 Windows 7, 8, 8.1, 10, 11 (32/64 bits) (Insiders preview is at your own risk)
