[project]
name = "astral-backend"
version = "0.1.0"
description = "Astrology app backend competing with Astra — offline ephemeris + multi-branch knowledge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "skyfield>=1.49",
    "openai>=1.40",
    "pytz>=2024.1",
    "supabase>=2.6",
    "stripe>=8.9",
    "pydantic-extra-types[phonenumbers]>=2.9",
    "slowapi>=0.1.9",
    "python-json-logger>=4.0",
    "python-dotenv>=1.0",
    "lunar-python>=1.4.8",
    "reportlab>=4.2",
    "pyswisseph>=2.10.3.2",
    "weasyprint>=69.0",
    "pypdf>=6.16.2",
    "pythainlp>=5.3.7",
    "easyocr>=1.7",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.workspace]
members = []
